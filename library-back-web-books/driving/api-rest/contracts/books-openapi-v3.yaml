      x-mercadona-security:
        operationgroups:
          - DCNA_GET_Books

    put:
      summary: Update book by ID
      description: Allows you to modify the information of an existing book using its unique identifier.
      operationId: updateBookById
      tags:
        - Books
      parameters:
        - name: id
          description: Private Book identifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/bookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookResourceRequest'
      responses:
        200:
          description: Book updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResourceResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
      security:
        - adfs: [ ]
      x-mercadona-security:
        operationgroups:
          - DCNA_POST_Books

    delete:
      summary: Delete book by ID
      description: Deletes a specific book from the system using its unique identifier.
      operationId: deleteBookById
      tags:
        - Books
      parameters:
        - name: id
          description: Private Book identifier
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/bookId'
      responses:
        204:
          description: Book deleted
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        403:
