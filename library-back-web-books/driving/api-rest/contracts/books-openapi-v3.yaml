                $ref: '#/components/schemas/ErrorResourceResponse'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
      security:
        - adfs: [ ]
      x-mercadona-security:
        operationgroups:
          - DCNA_SEARCH_Publishers

components:
  schemas:

    # Common components

    publicId:
      type: integer
      format: int64
      description: Public identifier
      example: 1

    publicIds:
      type: array
      items:
        $ref: '#/components/schemas/publicId'
      example: '[1, 2, 3]'

    # Book components

    bookId:
      type: string
      format: uuid
      description: Private Book identifier
      example: 'bbbbbbb1-bbbb-bbbb-bbbb-bbbbbbbbbbbb'

    title:
      type: string
      description: Book title
      example: 'Cien Años de Soledad'

    authors:
      type: array
      description: Authors information
      items:
        $ref: '#/components/schemas/AuthorResource'

    publishers:
      type: array
      description: Publisher information
      $ref: '#/components/schemas/PublisherResource'

    coverUrl:
      type: string
      description: Book cover url
      example: 'https://img/soledad.jpg'

    edition:
      type: string
      description: Book edition
      example: '1st'

    price:
      type: number
      format: float
      description: Book price
      example: 19.99

    languages:
      type: string
      description: Book languages
      example: 'ES'

    epubUrl:
      type: string
      description: Book epub url
      example: 'https://epub/soledad'

    isDigital:
      type: boolean
      description: Available in digital?
      example: true

    isDeleted:
      type: boolean
      default: Is deleted?
      example: false

    # Book Requests

    BookResourceRequest:
      title: BookResourceRequest
      type: object
      properties:
        publicId:
          $ref: '#/components/schemas/publicId'
        title:
          $ref: '#/components/schemas/title'
        authorId:
          $ref: '#/components/schemas/authorId'
        publisherId:
          $ref: '#/components/schemas/publisherId'
        coverUrl:
          $ref: '#/components/schemas/coverUrl'
        edition:
          $ref: '#/components/schemas/edition'
        price:
          $ref: '#/components/schemas/price'
        languages:
          $ref: '#/components/schemas/languages'
        epubUrl:
          $ref: '#/components/schemas/epubUrl'
        isDigital:
          $ref: '#/components/schemas/isDigital'
        isDeleted:
          $ref: '#/components/schemas/isDeleted'

    # Book Responses

    BookResource:
      title: BookResource
      type: object
      properties:
        id:
          $ref: '#/components/schemas/bookId'
        publicId:
          $ref: '#/components/schemas/publicId'
        title:
          $ref: '#/components/schemas/title'
        authors:
          $ref: '#/components/schemas/authors'
        publisher:
          $ref: '#/components/schemas/PublisherResource'
        coverUrl:
          $ref: '#/components/schemas/coverUrl'
        edition:
          $ref: '#/components/schemas/edition'
        price:
          $ref: '#/components/schemas/price'
        languages:
          $ref: '#/components/schemas/languages'
        epubUrl:
          $ref: '#/components/schemas/epubUrl'
        isDigital:
          $ref: '#/components/schemas/isDigital'
        isDeleted:
          $ref: '#/components/schemas/isDeleted'

    BookResourceResponse:
      title: BookResourceResponse
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BookResource'

    BookResourceCollection:
      title: BookResourceCollection
      type: object
      properties:
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookResource'

    BookResourceCollectionResponse:
      title: BookResourceCollectionResponse
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BookResourceCollection'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # Author components

    authorId:
      type: string
      format: uuid
      description: Private Author identifier
      example: 'aaaaaaa1-aaaa-aaaa-aaaa-aaaaaaaaaaaa'

    authorName:
      type: string
      example: 'Gabriel García Márquez'

    birthday:
      type: string
      format: date
      example: '1927-03-06'

    urlImage:
      type: string
      example: 'https://img/garciamarquez.jpg'

    # Author requests

    AuthorResourceRequest:
      title: AuthorResourceRequest
      type: object
      properties:
        publicId:
          $ref: '#/components/schemas/publicId'
        name:
          $ref: '#/components/schemas/authorName'
        birthday:
          $ref: '#/components/schemas/birthday'
        urlImage:
          $ref: '#/components/schemas/urlImage'

    # Author Responses

    AuthorResource:
      title: AuthorResource
      type: object
      properties:
        id:
          $ref: '#/components/schemas/authorId'
        publicId:
          $ref: '#/components/schemas/publicId'
        name:
          $ref: '#/components/schemas/authorName'
        birthday:
          $ref: '#/components/schemas/birthday'
        urlImage:
          $ref: '#/components/schemas/urlImage'

    AuthorResourceResponse:
      title: AuthorResourceResponse
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthorResource'

    AuthorResourceCollection:
      title: AuthorResourceCollection
      type: object
      properties:
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorResource'

    AuthorResourceCollectionResponse:
      title: AuthorResourceCollectionResponse
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthorResourceCollection'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # Publisher components

    publisherId:
      type: string
      format: uuid
      description: Private Publisher identifier
      example: '11111111-1111-1111-1111-111111111111'

    publisherName:
      type: string
      example: 'Editorial Alpha'

    address:
      type: string
      example: 'Av. Central 123, CDMX'

#    geolocalization:
#      type: object
#      description: "Geographic point (latitude, longitude)."
#      properties:
#        latitude:
#          type: number
#          format: double
#          example: 19.4326
#        longitude:
#          type: number
#          format: double
#          example: -99.1332
#      required:
#        - latitude
#        - longitude

    # Publisher Requests

    PublisherResourceRequest:
      title: PublisherResourceResponse
      type: object
      properties:
        publicId:
          $ref: '#/components/schemas/publicId'
        name:
          $ref: '#/components/schemas/publisherName'
        address:
          $ref: '#/components/schemas/address'
#        geolocalization:
#          $ref: '#/components/schemas/geolocalization'

    # Publisher Responses

    PublisherResource:
      title: PublisherResource
      type: object
      properties:
        id:
          $ref: '#/components/schemas/publisherId'
        publicId:
          $ref: '#/components/schemas/publicId'
        name:
          $ref: '#/components/schemas/publisherName'
        address:
          $ref: '#/components/schemas/address'
#        geolocalization:
#          $ref: '#/components/schemas/geolocalization'

    PublisherResourceResponse:
      title: PublisherResourceResponse
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PublisherResource'

    PublisherResourceCollection:
      title: PublisherResourceCollection
      type: object
      properties:
        publishers:
          type: array
          items:
            $ref: '#/components/schemas/PublisherResource'

    PublisherResourceCollectionResponse:
      title: PublisherResourceCollectionResponse
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PublisherResourceCollection'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # Error components

    errorCode:
      type: string

    errorDescription:
      type: string

    errorDetails:
      type: array
      items:
        type: string

    # Error resources

    ErrorResource:
      title: ErrorResource
      type: object
      properties:
        code:
          $ref: '#/components/schemas/errorCode'
        description:
          $ref: '#/components/schemas/errorDescription'
        details:
          $ref: '#/components/schemas/errorDetails'

    # Error responses

    ErrorResourceResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorResource'

    # Pagination components

    firstPage:
      type: integer
      format: int32
      default: 1
      description: Requested page (first page is page 1). If not specified 1 is used. [Cannot be negative or zero]

    pageSize:
      type: integer
      format: int32
      default: 10
      description: Number of retrieved elements per page. if not specified 10 is used. [Cannot be less than 1]

    sort:
      type: string
      description: 'Sort of the query. [sort=+id] will order asc by id, or [sort=+id] desc by id). Default unsorted.'

    requestedPage:
      type: integer
      format: int32
      description: Requested page (first page is page 1). If not specified 1 is used. [Cannot be negative or zero]

    requestedSize:
      type: integer
      format: int32
      description: Number of retrieved elements per page. if not specified 10 is used. [Cannot be less than 1]

    retrievedResults:
      type: integer
      format: int32
      description: Number of results retrieved in the current request.

    totalResults:
      type: integer
      format: int64
      description: Total number of results available across all pages.

    nextPage:
      type: string
      description: URL or token for next page

    previousPage:
      type: string
      description: URL or token for previous page

    # Pagination Response

    Pagination:
      type: object
      properties:
        requestedPage:
          $ref: '#/components/schemas/requestedPage'
        requestedSize:
          $ref: '#/components/schemas/requestedSize'
        retrievedResults:
          $ref: '#/components/schemas/retrievedResults'
        totalResults:
          $ref: '#/components/schemas/totalResults'
        nextPage:
          $ref: '#/components/schemas/nextPage'
        previousPage:
          $ref: '#/components/schemas/previousPage'

  # Security Components

  securitySchemes:
    adfs:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: ""
          scopes: { }
    aad:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: ""
          scopes: { }
