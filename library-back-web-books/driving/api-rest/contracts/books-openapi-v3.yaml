openapi: 3.0.1
info:
  title: Books API
  version: 1.0.0
  description: API for managing books, authors, and publishers.
tags:
  - name: Books
    description: Operations related to books
  - name: Authors
    description: Operations related to authors
  - name: Publishers
    description: Operations related to publishers
paths:

  # Books Endpoint

  /books:

    get:
      summary: Get list of books
      description: This method retrieves a paginated collection of books available in the system.
      operationId: getBookResourceCollection
      tags:
        - Books
      parameters:
        - name: firstPage
          in: query
          description: Requested page (first page is page 1). If not specified 1 is
            used. [Cannot be negative or zero]
          schema:
            $ref: '#/components/schemas/firstPage'
        - name: pageSize
          in: query
          description: Number of retrieved elements per page. if not specified 10 is
            used. [Cannot be less than 1]
          schema:
            $ref: '#/components/schemas/pageSize'
        - name: sort
          in: query
          description: 'Sort of the query. [sort=+id] will order asc by id, or [sort=-id] desc by id). Default unsorted.'
          schema:
            $ref: '#/components/schemas/sort'
      responses:
        200:
          description: List of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResourceCollectionResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
      security:
        - adfs: [ ]
      x-mercadona-security:
        operationgroups:
          - DCNA_GET_Books

    post:
      summary: Create a book
      description: This method allows you to create a new book in the system with the information provided in the request body.
      operationId: createBook
      tags:
        - Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookResourceRequest'
      responses:
        201:
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResourceResponse'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResourceResponse'
      security:
        - adfs: [ ]
      x-mercadona-security:
        operationgroups:
          - DCNA_POST_Books

  /books/{id}:

    get:
      summary: Get book by ID
      description: Retrieves the details of a specific book using its unique identifier.
