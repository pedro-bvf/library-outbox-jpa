spring:
  application:
    name: library-back-snk-availability

  flyway:
    locations: classpath:migration/versions
    baseline-on-migrate: true
    baseline-version: 0

  datasource:
    url: ${DATABASE_PREFIX}${DATABASE_URL}/${DATABASE_NAME}
    driver-class-name: ${CLOUD_SQL_DATABASE_DRIVER}
    username: ${CLOUD_SQL_DATABASE_USERNAME}
    password: ${CLOUD_SQL_DATABASE_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      idle-timeout: 30000
      max-lifetime: 2000000
      connection-timeout: 30000

  jpa:
    open-in-view: false


  kafka:
    properties:
      basic.auth.credentials.source: "USER_INFO"
      schema:
        registry:
          url: "${SCHEMA_REGISTRY_URL:http://localhost:9081}"
          basic.auth.user.info: "${KAFKA_USER}:${KAFKA_PASSWORD}"
      security:
        protocol: "SASL_SSL"
      sasl:
        mechanism: "PLAIN"
        jaas.config: "org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_USER}' password='${KAFKA_PASSWORD}';"
    consumer:
      bootstrap-servers: "${BOOTSTRAP_SERVERS:localhost:29092}"
      properties:
        specific.avro.reader: true
        key.deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
        value.deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer


books:
  kafka:
    consumer:
      topic: library.availability.event.restrictedout.v0.canonical.cpd
      groupId: library-back-snk-availability

# Actuator endpoints configuration
management:
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: [ info, health, metrics, prometheus ]

server:
  port: 8080
